- id: agent-harness
  name: Agent harness and event pipeline
  category: cross-cutting
  summary: 'AgentHarness<TMetadata> coordinates turns: session + model selection, phase tracking (Idle/turn/compaction), steering/follow-up/next-turn queue, tool registration, system-prompt composition,
    agent loop, persistence, extension events, compaction/branch summarization. Loop events flow through a durability-first pipeline: PersistenceStage -> PhaseTransitionStage -> ToolMiddlewareStage -> ExtensionDispatchStage
    -> ListenerNotificationStage. Hot event consumers are kept off the harness critical path; mutating extension hooks run synchronously.

    '
  implemented_in:
  - src/PiSharp.Agent
  - src/PiSharp.Runtime
  related_units:
  - pi-sharp-agent
  - pi-sharp-runtime
  entry_points:
  - src/PiSharp.Agent/Harness/AgentHarness.cs
  - src/PiSharp.Agent/Loops/AgentLoop.cs
  dependencies:
    upstream:
    - PiSharp.Abstractions
    - PiSharp.Agent.Core
    downstream:
    - PiSharp.TsBridge
    - PiSharp.Server
    - PiSharp.Tui
    external: []
  related_concerns:
  - session-persistence
  - extension-platform
  common_changes:
  - change the loop event pipeline
  - alter compaction behavior
  - add an agent event type
  invariants:
  - 'Durability-first ordering: session writes ahead of extension/listener notification (developer guide).'
  - Mutating extension hooks stay synchronous because return values affect behavior.
  risk:
    level: high
    reasons:
    - Core loop changes affect every session, every turn.
    - Pipeline stage order is load-bearing for durability.
  documentation:
  - docs/pisharp-developer-guide.md
  - docs/pisharp-runtime.md
  confidence: high
  evidence:
  - path: src/PiSharp.Agent/Harness/AgentHarness.cs
    supports: harness coordination + pipeline
    kind: implementation
  - path: tests/PiSharp.Agent.Tests
    supports: harness/loop pipeline event coverage
    kind: test
