schema_version: 1
verified_at_commit: 646522ccc6edc48acc39e4545cd120af9f1dafba
notes: 'Synthesized from the structural map, documentation audit, and focused concern investigation. Cross-cutting concerns span structural units; no directory tree shape is implied.

  '
concerns:
- id: extension-platform
  name: Extension platform and lifecycle
  category: cross-cutting
  summary: 'The two extension paths (native .dll via collectible AssemblyLoadContext, TypeScript via Node sidecar) register into one ExtensionRegistry/ExtensionManager surface: tools, slash commands, TUI
    shortcuts, flags, prompt contributions, providers, events, middleware, UI, rules, skills, and state all flow through IExtensionApi. Native plugins are discovered under <cwd>/plugins, <cwd>/.pi/extensions,
    and ~/.pi/extensions (per PluginHostOptions.FromCwd) and loaded through NativePluginHost''s collectible PluginLoadContext so they can be unloaded.

    '
  implemented_in:
  - src/PiSharp.Extensions
  - src/PiSharp.PluginHost
  - src/PiSharp.TsBridge
  - src/PiSharp.Runtime
  related_units:
  - pi-sharp-extensions
  - pi-sharp-plugin-host
  - pi-sharp-ts-bridge
  - pi-sharp-runtime
  - pi-sharp-cli
  entry_points:
  - src/PiSharp.Extensions/IExtensionApi.cs
  - src/PiSharp.Extensions/ExtensionManager.cs
  - src/PiSharp.PluginHost/NativePluginHost.cs
  dependencies:
    upstream:
    - PiSharp.Abstractions
    - PiSharp.Agent.Core
    downstream:
    - All feature-extension plugins (Ast, Git, Eval, Memory, PlanMode, Permissions, ...)
    external:
    - Node.js (TsBridge sidecar)
    - .NET assembly loading (collectible ALC)
  related_concerns:
  - tsbridge-parity
  - session-persistence
  common_changes:
  - add a native .NET extension/plugin
  - add a TypeScript extension
  - extend IExtensionApi with a new capability
  - change extension discovery or load order
  invariants:
  - 'Extensions must not depend on runtime/CLI/TUI projects (AGENTS.md: keep extension bridge/plugin host concerns inside TsBridge/PluginHost).'
  - Extension API additions must remain backward compatible with JS-Pi extension contracts.
  - UI-specific extension behavior must be guarded by api.HasUi for non-interactive modes.
  risk:
    level: high
    reasons:
    - Extension-first policy means most new product behavior lands here; blast radius spans the whole runtime surface.
    - Collectible ALC load/unload semantics are easy to break silently.
    - Backward compatibility with the original JavaScript Pi extension contracts is a hard requirement.
  documentation:
  - docs/pisharp-native-extensions.md
  - docs/pisharp-typescript-extensions.md
  - docs/pisharp-plugins.md
  confidence: high
  evidence:
  - path: src/PiSharp.PluginHost/PluginLoadContext.cs
    supports: collectible AssemblyLoadContext loading
    kind: implementation
  - path: src/PiSharp.Extensions/ExtensionManager.cs
    supports: single registry surface for both extension paths
    kind: implementation
  - path: AGENTS.md
    supports: extension-first policy + backward-compat requirement
    kind: documentation
- id: tsbridge-parity
  name: TypeScript bridge parity contract
  category: cross-cutting
  summary: 'TsBridgeManifestFactory.CreateApiSurfaceManifest() is the source of truth for the Pi <-> JavaScript Pi API surface. Every Runtime(...) manifest entry must be wired end-to-end (runtime action
    -> ExtensionRuntimeBinding -> Node wrapper), and every Snapshot(...) entry must be populated live in RuntimeExtensionBinder.BuildSessionSnapshotAsync with no hard-coded fallbacks. Tests enforce that
    the manifest contains no roadmap/unsupported statuses.

    '
  implemented_in:
  - src/PiSharp.TsBridge/TsBridgeManifestFactory.cs
  - src/PiSharp.TsBridge/Node/TsBridgeRunner.mjs
  related_units:
  - pi-sharp-ts-bridge
  - pi-sharp-runtime
  entry_points:
  - src/PiSharp.TsBridge/TsBridgeManifestFactory.cs (CreateApiSurfaceManifest)
  - src/PiSharp.TsBridge/RuntimeExtensionBinder.cs (BuildSessionSnapshotAsync)
  dependencies:
    upstream:
    - PiSharp.Agent
    - PiSharp.Extensions
    downstream:
    - Node sidecar runner
    external:
    - Node.js / npm (build-time sidecar compile)
  related_concerns:
  - extension-platform
  - session-persistence
  common_changes:
  - add a TsBridge runtime action
  - add a snapshot field
  - extend the manifest
  invariants:
  - Never add Planned(...)/not-yet-supported/stale labels or broad compatibility stubs for missing JS Pi APIs (AGENTS.md).
  - Never expose snapshot fields with hard-coded fallbacks like () => true/false/undefined/{}.
  - Every Runtime(...) manifest entry must be wired across all layers before declaration.
  risk:
    level: high
    reasons:
    - Manifest is a contract; declaring unwired entries misleads every extension author.
    - Cross-layer wiring (C# manifest, runtime actions, Node wrappers) has many failure points.
  documentation:
  - docs/pisharp-typescript-extensions.md
  - AGENTS.md
  confidence: high
  evidence:
  - path: src/PiSharp.TsBridge/TsBridgeManifestFactory.cs
    supports: CreateApiSurfaceManifest as parity contract source of truth
    kind: implementation
  - path: tests/PiSharp.TsBridge.Tests
    supports: manifest enforcement tests incl. no-roadmap-status test
    kind: test
  - path: AGENTS.md
    supports: parity contract rules
    kind: documentation
- id: session-persistence
  name: Session persistence and JSONL format
  category: cross-cutting
  summary: 'JSONL-backed session storage (JsonlSessionRepo) with session continuation, forking/branching, compaction, labels, model/thinking-level changes, and save-points. Default location ~/.pi/agent/sessions.
    Compatibility with the original JS Pi JSONL session format is preserved (header version 3, leaf entries). PiSharp.Compatibility owns PiSettingsStore, PiAgentPaths, and PiResourceLoader (settings/session/resource
    conventions).

    '
  implemented_in:
  - src/PiSharp.Compatibility
  - src/PiSharp.Runtime
  - src/PiSharp.Agent
  related_units:
  - pi-sharp-agent
  - pi-sharp-compatibility
  - pi-sharp-runtime
  entry_points:
  - src/PiSharp.Agent/Sessions/JsonlSessionRepo.cs
  - src/PiSharp.Compatibility/Settings/PiSettingsStore.cs
  dependencies:
    upstream:
    - PiSharp.Abstractions
    downstream:
    - PiSharp.TsBridge (session snapshot surface)
    - PiSharp.Server (live sessions)
    external: []
  related_concerns:
  - settings-resource-discovery
  - agent-harness
  common_changes:
  - change session storage format
  - alter compaction behavior
  - add a session metadata field
  invariants:
  - 'Session JSONL compatibility with JS Pi must be preserved (README: JSONL session compatibility by default).'
  - Compaction and branch summarization must not lose the session tree shape.
  risk:
    level: high
    reasons:
    - User session data is long-lived; format drift breaks resume/continuation.
    - Compat layer deliberately preserves JS Pi conventions (legacy paths, session shapes).
  documentation:
  - docs/pisharp-runtime.md
  - docs/pisharp-vs-pi.md
  confidence: high
  evidence:
  - path: src/PiSharp.Agent/Sessions
    supports: JSONL session repo, branching, compaction services
    kind: implementation
  - path: tests/PiSharp.Agent.Tests
    supports: session/JSONL/serialization/compaction coverage
    kind: test
- id: settings-resource-discovery
  name: Settings layers and resource discovery
  category: cross-cutting
  summary: 'PiSettingsStore resolves settings across four layers (global/project x legacy/PiSharp): ~/.pi/agent/settings.json, ~/.pi/PiSharp/settings.json, <cwd>/.pi/settings.json, <cwd>/.pi/PiSharp/settings.json.
    PiResourceLoader discovers extensions, skills, prompts, prompt templates, themes, context files, packages, system prompts, and append prompts. CLI flags override settings at runtime.

    '
  implemented_in:
  - src/PiSharp.Compatibility
  - src/PiSharp.Runtime
  related_units:
  - pi-sharp-compatibility
  - pi-sharp-runtime
  - pi-sharp-cli
  entry_points:
  - src/PiSharp.Compatibility/Settings/PiSettingsStore.cs
  - src/PiSharp.Compatibility/Resources/PiResourceLoader.cs
  - src/PiSharp.Compatibility/PiAgentPaths.cs
  dependencies:
    upstream: []
    downstream:
    - Everything that reads settings or resources
    external: []
  related_concerns:
  - session-persistence
  common_changes:
  - add a settings key
  - change resource discovery precedence
  - alter path resolution
  invariants:
  - 'Settings precedence: CLI flags > project PiSharp > project legacy > global PiSharp > global legacy.'
  - 'AGENTS.md: register extension flags/options before applying CLI flag values.'
  risk:
    level: medium
    reasons:
    - Precedence mistakes change behavior across every user environment.
    - Legacy Pi settings paths must keep working.
  documentation:
  - docs/pisharp-runtime.md
  - docs/pisharp-vs-pi.md
  confidence: high
  evidence:
  - path: tests/PiSharp.Compatibility.Tests
    supports: settings layer/atomic-write/offline/profile tests
    kind: test
  - path: docs/pisharp-runtime.md
    supports: settings precedence and resource discovery
    kind: documentation
- id: daemon-protocol
  name: Daemon and event-sourced wire protocol
  category: cross-cutting
  summary: 'PiSharp.Server (Kestrel PiServerHost: /health open, /ws API-key protected) hosts warm SessionRuntimes; PiSharp.Client is an event-sourced WebSocket client that reconstructs UI state by replaying
    sequence-numbered events (retained 100k-envelope ring buffer, attach{sinceSequence}, gap recovery via get_state). Commands are flat ServerCommandEnvelope frames; async work returns accepted=true and
    lifecycle flows over the event stream. Lease at ~/.pi/PiSharp/daemon.json. The daemon process is PiSharp.Cli `daemon foreground` hosting PiServerHost.

    '
  implemented_in:
  - src/PiSharp.Server
  - src/PiSharp.Client
  - src/PiSharp.Sdk
  - src/PiSharp.Cli
  related_units:
  - pi-sharp-server
  - pi-sharp-client
  - pi-sharp-cli
  - pi-sharp-sdk
  entry_points:
  - src/PiSharp.Server/Hosting/PiServerHost.cs
  - src/PiSharp.Server/WebSocket/PiServerWebSocketHandler.cs
  - src/PiSharp.Client/ClientEventReducer.cs
  dependencies:
    upstream:
    - PiSharp.Runtime (SessionRuntime per server session)
    downstream:
    - PiSharp.Tui (RemoteTuiBackend)
    - pisharp-session-webapp (browser twin)
    external: []
  related_concerns:
  - agent-harness
  common_changes:
  - add a daemon wire command
  - change event envelope shape
  - alter replay/gap-recovery behavior
  invariants:
  - Every new command needs a ServerCommandTypes const, a command record in ServerContracts.cs, and a case in PiServerWebSocketHandler (ADR consequence).
  - Client state is mutated only by the pure ClientEventReducer + one-time command results.
  - Protocol evolution must stay backward compatible or bump the version check.
  risk:
    level: high
    reasons:
    - Wire protocol is the contract between daemon, client, SDK, and webapp; breaking it breaks all consumers.
    - API-key auth on /ws is a security boundary.
    - Gap recovery and replay are subtle; a wrong reducer silently corrupts UI state.
  documentation:
  - docs/adr/2026-08-14-daemon-client-architecture.md
  - docs/pisharp-developer-guide.md
  confidence: high
  evidence:
  - path: docs/adr/2026-08-14-daemon-client-architecture.md
    supports: canonical daemon/client decision
    kind: documentation
  - path: src/PiSharp.Client/ClientEventReducer.cs
    supports: pure reducer contract
    kind: implementation
  - path: tests/PiSharp.Client.Tests
    supports: client event/replay coverage
    kind: test
