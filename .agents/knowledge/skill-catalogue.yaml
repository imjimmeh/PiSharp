    - choose which tests to run
    - follow TDD workflow
  scores:
    modification_frequency: 2
    complexity: 1
    cross_boundary_reach: 2
    risk: 2
    documentation_gap: 1
    project_specificity: 1
    agent_usefulness: 2
    weighted_total: 23
  decision: merge-into
  decision_reason: 'Commands and conventions overlap local-development; a separate skill would duplicate the build/test gate. Merged as the Testing section in local-development.

    '
  related_candidates:
  - local-development
  assigned_investigation:
    status: complete
    source: coordinator (csproj inventory + documentation audit)
  evidence:
  - path: tests
    supports: one test project per src project
    kind: test
- id: extension-platform
  title: Extension platform and lifecycle
  type: cross-cutting
  summary: 'Both extension paths (native .dll via collectible ALC; TypeScript via Node sidecar) register into one registry surface. IExtensionApi exposes Settings/State/Tools/Skills/Packages/Model/Events/Prompt/Completion/Search/
    Urls/Rules/Telemetry/Ui/HasUi plus RegisterTool/Skill/Command/Shortcut/Flag/ Provider/MessageRenderer/MessageDecorator, On(event), Use(middleware). Native discovery: <cwd>/plugins, <cwd>/.pi/extensions,
    ~/.pi/extensions. Workflow: add a native extension (net10.0 class library, [ExtensionMetadata("id")], depend only on Extensions/Agent.Core/Abstractions, add tests + docs).

    '
  proposed_scope:
  - src/PiSharp.Extensions
  - src/PiSharp.PluginHost
  - src/PiSharp.TsBridge
  - src/PiSharp.Runtime (extension binding)
  use_when:
    concepts:
    - extension
    - plugin
    - IExtension
    - IExtensionApi
    - native extension
    - TypeScript extension
    paths:
    - src/PiSharp.Extensions/**
    - src/PiSharp.PluginHost/**
    tasks:
    - add a native .NET extension/plugin
    - register tools/commands/shortcuts/flags from an extension
    - extend IExtensionApi
    - change extension discovery/loading
  scores:
    modification_frequency: 3
    complexity: 3
    cross_boundary_reach: 3
    risk: 3
    documentation_gap: 1
    project_specificity: 3
    agent_usefulness: 3
    weighted_total: 40
  decision: dedicated-skill
  decision_reason: 'Extension-first policy makes this the primary place new product behavior lands; high blast radius, load-bearing lifecycle semantics, and both paths share one registry.

    '
  related_candidates:
  - tsbridge-parity
  - plugin-portfolio
  - add-native-extension
  assigned_investigation:
    status: complete
    source: coordinator (IExtensionApi.cs, ExtensionManager.cs, PluginHost reads)
  evidence:
  - path: src/PiSharp.Extensions/IExtensionApi.cs
    supports: extension API surface
    kind: implementation
  - path: src/PiSharp.Extensions/ExtensionManager.cs
    supports: single registry for both paths
    kind: implementation
  - path: src/PiSharp.PluginHost/PluginLoadContext.cs
    supports: collectible ALC loading
    kind: implementation
