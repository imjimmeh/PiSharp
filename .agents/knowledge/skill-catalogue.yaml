  type: orientation
  summary: 'One test project per src project (tests/<Project>.Tests), xunit on net10.0, TDD red-green-refactor expectation, per-project gates preferred over full solution runs, and the implementation-status.md
    evidence culture. Read-only test projects (Extensions.Testing) and InternalsVisibleTo usage.

    '
  proposed_scope:
  - tests
  - Directory.Build.props
  use_when:
    concepts:
    - test
    - tdd
    - xunit
    - test project
    paths:
    - tests/**
