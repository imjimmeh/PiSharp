schema_version: 1
verified_at_commit: 646522ccc6edc48acc39e4545cd120af9f1dafba
catalogue:
- id: repository-overview
  title: PiSharp repository overview
  type: orientation
  summary: 'What PiSharp is, how the ~52 src projects and 43 test projects fit together, the layer discipline (Abstractions/Agent.Core dependency-light, Runtime as composition root), the extension-first
    policy, and which documentation is authoritative. Also carries the javascript/ reference-only guardrail and the daemon/client split.

    '
  proposed_scope:
  - src
  - tests
  - docs/pisharp-developer-guide.md
  - AGENTS.md
  use_when:
    concepts:
    - pi
    - pisharp
    - repository layout
    - project map
    - architecture overview
    - which docs are current
    paths:
    - src/**
    - docs/**
    tasks:
    - orient on the repository before a change
    - find which project owns a concern
    - decide whether a change belongs in core or an extension
  scores:
    modification_frequency: 1
    complexity: 2
    cross_boundary_reach: 3
    risk: 1
    documentation_gap: 1
    project_specificity: 3
    agent_usefulness: 3
    weighted_total: 30
  decision: dedicated-skill
  decision_reason: 'Essential orientation for every agent session; routes to all other skills and prevents architecture-boundary violations (AGENTS.md) and javascript/ edits.

    '
  related_candidates:
  - architecture-boundaries
  - local-development
  - testing-strategy
  assigned_investigation:
    status: complete
    source: coordinator (charter + structural map + documentation audit)
  evidence:
  - path: AGENTS.md
    supports: guardrails, extension-first policy, build/test commands
    kind: documentation
  - path: docs/pisharp-developer-guide.md
    supports: canonical project map + daemon/client architecture
    kind: documentation
- id: architecture-boundaries
  title: Architecture and dependency boundaries
  type: cross-cutting
  summary: 'Layer discipline: Abstractions and Agent.Core are dependency-light contract layers; no dependencies from abstractions/core back into runtime/CLI/TUI; runtime wiring stays in PiSharp.Runtime;
    extension bridge/plugin host concerns stay in TsBridge/PluginHost. Extension projects depend on Extensions/Agent.Core/ Abstractions, never on Runtime/Cli/Tui.

    '
  proposed_scope:
  - src/PiSharp.Abstractions
  - src/PiSharp.Agent.Core
  - src/PiSharp.Runtime
  - src/PiSharp.TsBridge
  - src/PiSharp.PluginHost
  use_when:
    concepts:
    - dependency boundary
    - layer discipline
    - project reference
    - architecture
    paths:
    - src/**/*.csproj
    tasks:
    - add a project reference
    - move code between projects
    - introduce a new project
  scores:
    modification_frequency: 2
    complexity: 3
    cross_boundary_reach: 3
    risk: 3
    documentation_gap: 0
    project_specificity: 3
    agent_usefulness: 3
    weighted_total: 38
  decision: merge-into
  decision_reason: 'The rules are short, fully captured by AGENTS.md, and enforced by the structural map; a standalone skill would duplicate repository-overview. Merged as a section in repository-overview.

    '
  related_candidates:
  - repository-overview
  assigned_investigation:
    status: complete
    source: coordinator (AGENTS.md + csproj manifest reads)
  evidence:
  - path: AGENTS.md
    supports: architecture boundaries section
    kind: documentation
- id: local-development
  title: Local development, build, and test
  type: orientation
  summary: 'Build/test/run workflow: dotnet build/test PiSharp.sln (all 52 src + 43 test C# projects), per-project test gates, PiSharp.Cli as the executable, install scripts and Makefile, CI (build+test
    on master; release pack on v* tags), log/settings locations, TDD conventions, and the pitfall that per-project tests are the reliable gate for a single change.

    '
  proposed_scope:
  - PiSharp.sln
  - Directory.Build.props
  - Makefile
  - install.sh
  - install.ps1
  - .github/workflows
  - tests
  use_when:
    concepts:
    - build
    - test
    - run
    - dotnet
    - ci
    - install
    - debugging
    paths:
    - PiSharp.sln
    - tests/**
    - .github/workflows/**
    tasks:
    - build the solution
    - run tests for one project
    - run the CLI locally
    - debug a failing test
  scores:
    modification_frequency: 2
    complexity: 1
    cross_boundary_reach: 2
    risk: 2
    documentation_gap: 1
    project_specificity: 2
    agent_usefulness: 3
    weighted_total: 28
  decision: dedicated-skill
  decision_reason: 'Every agent needs verified commands before touching code; sln membership and CI coverage have non-obvious details (extensions/ and webapp excluded).

    '
  related_candidates:
  - testing-strategy
  - repository-overview
  assigned_investigation:
    status: complete
    source: coordinator (verified sln membership, AGENTS.md, Makefile, CI)
  evidence:
  - path: AGENTS.md
    supports: build/test commands
    kind: documentation
  - path: .github/workflows/ci.yml
    supports: CI gate
    kind: workflow
- id: testing-strategy
