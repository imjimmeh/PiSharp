  type: workflow
  summary: 'Recurring workflow: create net10.0 class library implementing IExtension with [ExtensionMetadata("id")], register surface through IExtensionApi, add a test project under tests/, document in
    pisharp-plugins.md + implementation-status. Reference pattern: the P07-P31 plugin portfolio.

    '
  proposed_scope:
  - src (new plugin project)
  - tests (new test project)
  - docs/pisharp-plugins.md
  use_when:
    concepts:
    - add a plugin
    - new extension
    - plugin project
    paths:
    - src/PiSharp.Plugins.*
    tasks:
    - create a new native plugin
    - add a plugin to the portfolio
  scores:
    modification_frequency: 2
    complexity: 2
    cross_boundary_reach: 2
    risk: 2
    documentation_gap: 1
    project_specificity: 3
    agent_usefulness: 2
    weighted_total: 29
  decision: merge-into
  decision_reason: 'The workflow is the plugin-portfolio/extension-platform pattern; a standalone workflow skill would duplicate them. Kept as the primary workflow inside extension-platform.

    '
  related_candidates:
  - extension-platform
  - plugin-portfolio
  assigned_investigation:
    status: complete
    source: coordinator (docs/pisharp-native-extensions.md + plugin projects)
  evidence:
  - path: docs/pisharp-native-extensions.md
    supports: plugin authoring workflow
    kind: documentation
- id: tsbridge-parity
  title: TypeScript bridge parity contract
  type: specialist
  summary: 'TsBridgeManifestFactory.CreateApiSurfaceManifest() is the parity contract source of truth. Runtime(...) entries must be wired end-to-end (manifest -> runtime action -> ExtensionRuntimeBinding
    -> Node wrapper). Snapshot(...) entries must be live in RuntimeExtensionBinder.BuildSessionSnapshotAsync with no hard-coded fallbacks. Tests enforce no roadmap/unsupported statuses.

    '
  proposed_scope:
  - src/PiSharp.TsBridge/TsBridgeManifestFactory.cs
  - src/PiSharp.TsBridge/RuntimeExtensionBinder.cs
  - src/PiSharp.TsBridge/Node/src/runner
  - src/PiSharp.TsBridge/Node/TsBridgeRunner.mjs
  use_when:
    concepts:
    - tsbridge
    - parity
    - manifest
    - runtime action
    - snapshot
    - TypeScript extension bridge
    paths:
    - src/PiSharp.TsBridge/**
    tasks:
    - add a TsBridge runtime action
    - add a snapshot field
    - extend the manifest
    - fix parity test failures
  scores:
    modification_frequency: 2
    complexity: 3
    cross_boundary_reach: 3
    risk: 3
    documentation_gap: 0
    project_specificity: 3
    agent_usefulness: 3
    weighted_total: 38
  decision: dedicated-skill
  decision_reason: 'AGENTS.md treats the manifest as a contract; unwired entries or fallback snapshots mislead every extension author. Cross-layer wiring has many failure points and dedicated enforcement
    tests.

    '
  related_candidates:
  - extension-platform
  assigned_investigation:
    status: complete
    source: coordinator (TsBridgeManifestFactory.cs + AGENTS.md + doc audit)
  evidence:
  - path: src/PiSharp.TsBridge/TsBridgeManifestFactory.cs
    supports: CreateApiSurfaceManifest parity contract
    kind: implementation
  - path: tests/PiSharp.TsBridge.Tests
    supports: manifest enforcement tests
    kind: test
  - path: AGENTS.md
    supports: parity contract rules
    kind: documentation
