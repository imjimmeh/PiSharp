- id: daemon-protocol
  title: Daemon and event-sourced wire protocol
  type: cross-cutting
  summary: 'Server (Kestrel /health + /ws, API-key auth) hosts warm SessionRuntimes; Client is an event-sourced WebSocket client (pure ClientEventReducer, attach with sinceSequence, gap recovery via get_state,
    retained 100k-envelope ring buffer). Commands: flat ServerCommandEnvelope; async work returns accepted and flows over events. Lease at ~/.pi/PiSharp/daemon.json. Workflow: add a daemon wire command
    (ServerCommandTypes const + ServerContracts record + PiServerWebSocketHandler case together). Daemon process is PiSharp.Cli `daemon foreground` hosting PiServerHost.

    '
  proposed_scope:
  - src/PiSharp.Server
  - src/PiSharp.Client
  - src/PiSharp.Cli/Modes/DaemonMode.cs
  - src/PiSharp.Sdk
  - docs/adr/2026-08-14-daemon-client-architecture.md
  use_when:
    concepts:
    - daemon
    - websocket
    - wire protocol
    - server command
    - event sourcing
    - replay
    - attach
    - lease
    paths:
    - src/PiSharp.Server/**
    - src/PiSharp.Client/**
    - src/PiSharp.Sdk/**
    tasks:
    - add a daemon wire command
    - change the event envelope
    - alter replay/gap recovery
    - debug daemon/client behavior
  scores:
    modification_frequency: 2
    complexity: 3
    cross_boundary_reach: 3
    risk: 3
    documentation_gap: 1
    project_specificity: 3
    agent_usefulness: 3
    weighted_total: 39
  decision: dedicated-skill
  decision_reason: 'Wire protocol is the contract between daemon, client, SDK, and webapp; the three-touchpoint command workflow and pure-reducer invariant are load-bearing and non-obvious.

    '
  related_candidates:
  - add-daemon-command
  - tui-development
  assigned_investigation:
    status: complete
    source: coordinator (ADR + ClientEventReducer + structural map)
  evidence:
  - path: docs/adr/2026-08-14-daemon-client-architecture.md
    supports: canonical daemon/client decision
    kind: documentation
  - path: src/PiSharp.Client/ClientEventReducer.cs
    supports: pure reducer invariant
    kind: implementation
